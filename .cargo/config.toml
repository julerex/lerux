[env]
RUSTC_BOOTSTRAP = "1"

# Soft-float x86 protection domains cannot use curve25519-dalek's simd backend.
[target.x86_64-sel4-microkit]
rustflags = [
    "--cfg", "curve25519_dalek_backend=\"serial\"",
    "--cfg", "aes_force_soft",
    "--cfg", "chacha20_force_soft",
    "--cfg", "poly1305_force_soft",
    "--cfg", "polyval_force_soft",
]