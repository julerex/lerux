name: seL4 smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MICROKIT_BOARDS: qemu_virt_aarch64,x86_64_generic,qemu_virt_riscv64
  # GHA cache keys cannot contain commas; keep in sync with MICROKIT_BOARDS.
  SDK_CACHE_SUFFIX: virt-aarch64-x86-riscv

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-04
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install just
        run: bash .github/scripts/install-just.sh

      - name: Format and clippy
        run: just check

  verify-ring:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-04
          components: rustfmt

      - name: Cache the pinned Verus release
        uses: actions/cache@v4
        with:
          path: deps/verus
          key: verus-0.2026.10.18.7d82994-verusfmt-0.7.4

      - name: Install just
        run: bash .github/scripts/install-just.sh

      - name: Prove the ring index crate
        run: just verify-ring

  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: lerux-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restore workspace cache
        uses: actions/cache/restore@v4
        id: workspace-cache
        with:
          path: deps/workspace
          key: workspace-${{ hashFiles('deps/versions.toml', 'tools/lerux-cli/**') }}
          restore-keys: |
            workspace-

      # The key prefix changed with the seL4 16 bump. A bare `sdk-` restore
      # brought back a Microkit 2.2.0 kit, the directory check treated it as
      # ready, and the job then saved that kit under the new key.
      - name: Restore SDK cache
        uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: deps/sdk-cache
          key: sdk-v2-${{ hashFiles('deps/versions.toml', 'tools/lerux-cli/**') }}-${{ env.SDK_CACHE_SUFFIX }}
          restore-keys: |
            sdk-v2-${{ hashFiles('deps/versions.toml', 'tools/lerux-cli/**') }}-

      - name: Fetch and build SDK
        run: |
          docker run --rm \
            -e MICROKIT_BOARDS="${{ env.MICROKIT_BOARDS }}" \
            -v "${{ github.workspace }}:/work" -w /work lerux-dev \
            bash -c "$(cat <<'EOF'
          set -euo pipefail
            just fetch
            LERUX_LIONSOS_LAYOUT=1 cargo test -p lerux-sddf --test layout
            if [[ -d deps/sdk-cache/microkit-sdk ]]; then
              mkdir -p deps/workspace/microkit/release
              rm -rf deps/workspace/microkit/release/microkit-sdk*
              cp -a deps/sdk-cache/microkit-sdk deps/workspace/microkit/release/
            fi
            sdk_ready() {
              local sdk want got
              sdk="$(find deps/workspace/microkit/release -maxdepth 1 -type d -name "microkit-sdk*" | sort | tail -1)"
              [[ -n "${sdk}" ]] || return 1
              [[ -d "${sdk}/board/qemu_virt_aarch64/debug/include" ]] || return 1
              [[ -d "${sdk}/board/qemu_virt_riscv64/debug/include" ]] || return 1
              [[ -f "${sdk}/board/x86_64_generic/debug/elf/sel4_32.elf" ]] || return 1
              want="$(sed -n 's/.*microkit = {.*tag = "\([^"]*\)".*/\1/p' deps/versions.toml)"
              [[ -n "${want}" && -f "${sdk}/VERSION" ]] || return 1
              got="$(tr -d '[:space:]' < "${sdk}/VERSION")"
              [[ "${got}" == "${want}" ]] || return 1
            }
            if sdk_ready; then
              echo "==> SDK cache hit, skipping build-sdk"
            else
              echo "==> SDK missing or VERSION does not match deps/versions.toml; building"
              just build-sdk
            fi
          EOF
          )"
          # Docker runs as root; host steps need write access under deps/.
          sudo chown -R "$(id -u):$(id -g)" deps

      - name: Normalize SDK path for host
        run: |
          set -euo pipefail
          sdk="$(find deps/workspace/microkit/release -maxdepth 1 -type d -name 'microkit-sdk*' | sort | tail -1)"
          if [[ -z "${sdk}" ]]; then
            echo "error: SDK not found under deps/workspace/microkit/release" >&2
            exit 1
          fi
          rm -f deps/.sdk-path
          echo "$(realpath "${sdk}")" > deps/.sdk-path

      - name: Save workspace cache
        if: steps.workspace-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/workspace
          key: workspace-${{ hashFiles('deps/versions.toml', 'tools/lerux-cli/**') }}

      - name: Stage SDK for cache
        run: |
          set -euo pipefail
          sdk="$(cat deps/.sdk-path)"
          chmod -R a+rX "${sdk}"
          find "${sdk}/bin" -type f -exec chmod a+x {} +
          mkdir -p deps/sdk-cache
          rm -rf deps/sdk-cache/microkit-sdk
          cp -a "${sdk}" deps/sdk-cache/microkit-sdk

      - name: Save SDK cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/sdk-cache
          key: sdk-v2-${{ hashFiles('deps/versions.toml', 'tools/lerux-cli/**') }}-${{ env.SDK_CACHE_SUFFIX }}

      - name: Restore SP804 QEMU cache
        uses: actions/cache/restore@v4
        id: qemu-sp804-cache
        with:
          path: |
            deps/toolchains/qemu-sp804
            deps/toolchains/qemu-6.2.0-src
            deps/toolchains/qemu-6.2.0.tar.xz
          key: qemu-sp804-${{ hashFiles('support/qemu/arm-virt-sp804.patch', 'tools/lerux-cli/**') }}
          restore-keys: |
            qemu-sp804-

      - name: Build SP804 QEMU
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work lerux-dev \
            bash -c 'set -euo pipefail
              if [[ -x deps/toolchains/qemu-sp804/bin/qemu-system-aarch64 ]]; then
                echo "==> SP804 QEMU cache hit"
              else
                cargo run -q -p lerux-cli -- install sp804-qemu >/dev/null
              fi
            '
          sudo chown -R "$(id -u):$(id -g)" deps
          chmod +x deps/toolchains/qemu-sp804/bin/qemu-system-aarch64

      - name: Save SP804 QEMU cache
        if: always() && steps.qemu-sp804-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps/toolchains/qemu-sp804
            deps/toolchains/qemu-6.2.0-src
            deps/toolchains/qemu-6.2.0.tar.xz
          key: qemu-sp804-${{ hashFiles('support/qemu/arm-virt-sp804.patch', 'tools/lerux-cli/**') }}

      # The Actions cache is shared with Docker layer caches and can be evicted
      # before the smoke jobs restore it. The artifact is the copy those jobs use.
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-sp804
          path: deps/toolchains/qemu-sp804/
          retention-days: 1
          if-no-files-found: error

      - name: Upload SDK bundle
        run: |
          set -euo pipefail
          sdk="$(cat deps/.sdk-path)"
          if [[ ! -d "${sdk}" ]]; then
            echo "error: SDK path from deps/.sdk-path does not exist: ${sdk}" >&2
            exit 1
          fi
          chmod -R a+rX "${sdk}"
          find "${sdk}/bin" -type f -exec chmod a+x {} +
          mkdir -p sdk-bundle
          cp deps/.sdk-path sdk-bundle/
          cp -a "${sdk}" sdk-bundle/microkit-sdk

      - uses: actions/upload-artifact@v4
        with:
          name: sdk
          path: sdk-bundle/
          retention-days: 1

  check-pd:
    needs: sdk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: lerux-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/download-artifact@v4
        with:
          name: sdk
          path: sdk-bundle

      - name: Install SDK from artifact
        run: |
          set -euo pipefail
          mkdir -p deps/workspace/microkit/release
          cp -a sdk-bundle/microkit-sdk deps/workspace/microkit/release/
          sdk="deps/workspace/microkit/release/$(basename sdk-bundle/microkit-sdk)"
          chmod -R a+rX "${sdk}"
          find "${sdk}/bin" -type f -exec chmod a+x {} +
          echo "/work/${sdk}" > deps/.sdk-path

      - name: Restore clippy cache
        uses: actions/cache/restore@v4
        id: clippy-cache
        with:
          path: build/target
          key: cargo-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-target-

      - name: Cross-target clippy
        id: clippy
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work lerux-dev \
            bash -c 'set -euo pipefail
              sdk="$(tr -d "\n" < deps/.sdk-path)"
              chmod -R a+rX "${sdk}"
              find "${sdk}/bin" -type f -exec chmod a+x {} +
              just check-pd
            '
          sudo chown -R "$(id -u):$(id -g)" build deps

      - name: Save clippy cache
        if: always() && steps.clippy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/target
          key: cargo-target-${{ hashFiles('Cargo.lock') }}

  smoke:
    needs: sdk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: aarch64
            board: qemu_virt_aarch64
            command: BOARD=qemu_virt_aarch64 just test
          - id: x86_64
            board: x86_64_generic
            command: BOARD=x86_64_generic just test
          - id: riscv64
            board: qemu_virt_riscv64
            command: just test-riscv
          - id: virtio
            board: qemu_virt_aarch64_virtio
            command: just disk-img && just test-virtio
          - id: cothread
            board: qemu_virt_aarch64_cothread
            command: just test-cothread
          - id: serial-sddf
            board: qemu_virt_aarch64_serial_sddf
            command: just test-serial-sddf
          - id: fs-sddf
            board: qemu_virt_aarch64_fs_sddf
            command: just test
          - id: net-sddf
            board: qemu_virt_aarch64_net_sddf
            command: just test-net-sddf
          - id: fetch-sddf
            board: qemu_virt_aarch64_fetch_sddf
            command: just test-fetch-sddf
          - id: web-sddf
            board: qemu_virt_aarch64_web_sddf
            command: just test-web-sddf
          - id: browser-sddf
            board: qemu_virt_aarch64_browser_sddf
            command: just test-browser-sddf
          - id: agent-sddf
            board: qemu_virt_aarch64_agent_sddf
            command: just test-agent-sddf
          - id: program-sddf
            board: qemu_virt_aarch64_program_sddf
            command: just test-program-sddf
          - id: html
            board: qemu_virt_aarch64_html
            command: just test-html
          - id: riscv-virtio
            board: qemu_virt_riscv64_virtio
            command: just disk-img && just test-riscv-virtio
          - id: http
            board: qemu_virt_aarch64_http
            command: just test-http
          - id: x86-http
            board: x86_64_generic_http
            command: just test-x86-http
          - id: riscv-http
            board: qemu_virt_riscv64_http
            command: just test-riscv-http
          - id: x86-virtio
            board: x86_64_generic_virtio
            command: just disk-img && just test-x86-virtio
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: lerux-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/download-artifact@v4
        with:
          name: sdk
          path: sdk-bundle

      - name: Install SDK from artifact
        run: |
          set -euo pipefail
          mkdir -p deps/workspace/microkit/release
          cp -a sdk-bundle/microkit-sdk deps/workspace/microkit/release/
          sdk="deps/workspace/microkit/release/$(basename sdk-bundle/microkit-sdk)"
          chmod -R a+rX "${sdk}"
          find "${sdk}/bin" -type f -exec chmod a+x {} +
          echo "/work/${sdk}" > deps/.sdk-path

      - name: Restore shared Cargo target cache
        uses: actions/cache/restore@v4
        with:
          path: build/target
          key: cargo-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-target-

      - name: Restore board build cache
        uses: actions/cache/restore@v4
        id: board-cache
        with:
          path: build/${{ matrix.board }}
          key: board-${{ matrix.id }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            board-${{ matrix.id }}-


      - name: Smoke test (${{ matrix.id }})
        id: smoke
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work lerux-dev \
            bash -c 'set -euo pipefail
              sdk="$(tr -d "\n" < deps/.sdk-path)"
              chmod -R a+rX "${sdk}"
              find "${sdk}/bin" -type f -exec chmod a+x {} +
              ${{ matrix.command }}
            '
          sudo chown -R "$(id -u):$(id -g)" build deps

      - name: Upload serial capture (Phase 57)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-serial-${{ matrix.id }}
          path: build/smoke-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Save shared Cargo target cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/target
          key: cargo-target-${{ hashFiles('Cargo.lock') }}

      - name: Save board build cache
        if: always() && steps.board-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/${{ matrix.board }}
          key: board-${{ matrix.id }}-${{ hashFiles('Cargo.lock') }}
