[workspace]
resolver = "3"
members = [
    "tools/lerux-cli",
    "tools/lerux-image",
    "userspace/pds/hello",
    "userspace/pds/serial-driver",
    "userspace/pds/sddf-serial-driver",
    "userspace/pds/sddf-serial-virt-tx",
    "userspace/pds/sddf-serial-virt-rx",
    "userspace/pds/sddf-serial-client",
    "userspace/pds/sddf-blk-driver",
    "userspace/pds/sddf-ahci-driver",
    "userspace/pds/sddf-blk-virt",
    "userspace/pds/sddf-fatfs",
    "userspace/pds/sddf-fs-client",
    "userspace/pds/sddf-shell",
    "userspace/pds/sddf-grok",
    "userspace/pds/sddf-agent",
    "userspace/pds/sddf-program",
    "userspace/pds/sddf-timer-driver",
    "userspace/pds/sddf-net-driver",
    "userspace/pds/sddf-e1000e-driver",
    "userspace/pds/sddf-net-virt-tx",
    "userspace/pds/sddf-net-virt-rx",
    "userspace/pds/sddf-net-copy",
    "userspace/pds/sddf-net-client",
    "userspace/pds/sddf-gpu-driver",
    "userspace/pds/sddf-gpu-virt",
    "userspace/pds/cothread-client",
    "userspace/pds/cothread-peer",
    "userspace/crates/lerux-serial-queue",
    "userspace/crates/lerux-sddf",
    "userspace/crates/lerux-ring",
    "userspace/crates/lerux-machine",
    "userspace/crates/lerux-driver-protocols",
    "userspace/pds/html-demo",
    "userspace/crates/lerux-html",
    "userspace/crates/lerux-input",
    "userspace/crates/lerux-desk",
    "userspace/crates/lerux-web",
    "userspace/crates/lerux-wasm",
    "userspace/crates/lerux-tls",
    "userspace/pds/pl031-driver",
    "userspace/pds/sp804-driver",
    "userspace/pds/goldfish-rtc-driver",
    "userspace/pds/rdtime-timer-driver",
    "userspace/pds/cmos-rtc-driver",
    "userspace/pds/rtl8852be-probe",
    "userspace/pds/console-driver",
    "userspace/pds/console-shell",
    "userspace/pds/tsc-timer-driver",
    "userspace/pds/virtio-blk-driver",
    "userspace/pds/virtio-net-driver",
    "userspace/pds/virtio-pci-driver",
    "userspace/pds/genet-driver",
    "userspace/pds/emmc2-driver",
    "userspace/pds/http-server",
    "userspace/crates/lerux-logging",
    "userspace/crates/lerux-rtw8852be",
    "userspace/crates/lerux-cothread",
    "userspace/crates/lerux-calc",
    "userspace/crates/lerux-gate",
    "userspace/crates/lerux-posix",
    "userspace/pds/debug-handler",
    "userspace/pds/crash-demo",
    "userspace/crates/lerux-virtio-hal",
    "userspace/crates/lerux-virtio-pci",
    "lerux-ladybird/crates/lerux-ladybird-url",
    "lerux-ladybird/crates/lerux-ladybird-gfx",
    "lerux-ladybird/crates/lerux-ladybird-html",
    "lerux-ladybird/crates/lerux-ladybird-web",
    "lerux-ladybird/crates/lerux-ladybird-http",
    "lerux-ladybird/crates/lerux-ladybird-js",
    "lerux-ladybird/crates/lerux-ladybird-image",
]

[workspace.dependencies]
sel4 = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-microkit = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-pl011-driver = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-driver-interfaces = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-microkit-driver-adapters = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-microkit-simple-ipc = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-logging = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-sync = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-virtio-blk = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-virtio-net = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-virtio-hal-impl = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
lerux-virtio-hal = { path = "userspace/crates/lerux-virtio-hal" }
lerux-virtio-pci = { path = "userspace/crates/lerux-virtio-pci" }
sel4-sp804-driver = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-pl031-driver = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-shared-memory = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-shared-ring-buffer = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-shared-ring-buffer-block-io-types = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-shared-ring-buffer-block-io = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-shared-ring-buffer-bookkeeping = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-shared-ring-buffer-smoltcp = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
sel4-abstract-allocator = { git = "https://github.com/seL4/rust-sel4", tag = "v5.0.0" }
smoltcp = { version = "0.13.0", default-features = false }
virtio-drivers = { version = "0.13.0", default-features = false }
embedded-hal-nb = "1.0"
lock_api = "0.4.14"
log = "0.4"
serde = { version = "1", default-features = false, features = ["derive"] }
heapless = { version = "0.9", default-features = false }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
redundant_clone = "warn"
needless_collect = "warn"
large_enum_variant = "warn"
