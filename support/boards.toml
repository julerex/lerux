qemu = { disk = "rw", net = "user", https_one = true, gpu = true }
ci = true
system_vars = { virtio_mmio_phys_addr = "0xa003000", virtio_blk_irq = 78, virtio_net_irq = 79, virtio_gpu_irq = 77, serial_mmio_phys_addr = "0x9_000_000", serial_irq = 33 }

