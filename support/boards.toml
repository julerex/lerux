system_vars = {}

# Milestone 6: the shell is the filesystem client. Serial roles share this image.
# The user-net device has no driver. It occupies the first virtio-mmio slot so
# virtio-blk stays at +0xc00.
[qemu_virt_aarch64_fs_sddf]
arch = "aarch64"
microkit_board = "qemu_virt_aarch64"
target = "aarch64-sel4-microkit"
template = "fs-sddf.system.template"
pds = ["sddf-blk-driver", "sddf-blk-virt", "sddf-fatfs", "sddf-serial-driver", "sddf-serial-virt-tx", "sddf-serial-virt-rx", "sddf-timer-driver", "sddf-shell"]
qemu = { disk = "rw", net = "user", qmp = true }
ci = true
system_vars = { virtio_mmio_phys_addr = "0xa003000", virtio_blk_irq = 78, serial_mmio_phys_addr = "0x9_000_000", serial_irq = 33 }

# Milestone 8: the shell owns smoltcp and the filesystem client. Virtio-net is
# the first device at +0xe00. Virtio-blk stays at +0xc00.
[qemu_virt_aarch64_fetch_sddf]
arch = "aarch64"
microkit_board = "qemu_virt_aarch64"
target = "aarch64-sel4-microkit"
template = "fetch-sddf.system.template"
pds = ["sddf-blk-driver", "sddf-blk-virt", "sddf-fatfs", "sddf-net-driver", "sddf-net-virt-tx", "sddf-net-virt-rx", "sddf-net-copy", "sddf-serial-driver", "sddf-serial-virt-tx", "sddf-serial-virt-rx", "sddf-shell"]
qemu = { disk = "rw", net = "user", https_one = true, tcp_echo = true }
ci = true
system_vars = { virtio_mmio_phys_addr = "0xa003000", virtio_blk_irq = 78, virtio_net_irq = 79, serial_mmio_phys_addr = "0x9_000_000", serial_irq = 33 }

# Milestone 11: the same roles. The shell serves the seeded hostname file.
# Hostfwd maps host port 18080 to guest port 8080.
[qemu_virt_aarch64_web_sddf]
arch = "aarch64"
microkit_board = "qemu_virt_aarch64"
target = "aarch64-sel4-microkit"
