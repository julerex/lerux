[package]
name = "agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Grok-shaped agent runtime, serial TUI, and FS/HTTP tools (Phase 77–79)"

[lints]
workspace = true

[features]
board-qemu_virt_aarch64_agent_runtime = []
# Phase 79: FsRequest + WebFetch GET (no fork/exec).
tools = []
board-qemu_virt_aarch64_agent = ["tools"]

[dependencies]
lerux-interface-types = { path = "../../crates/lerux-interface-types" }
lerux-ipc = { path = "../../crates/lerux-ipc" }
lerux-logging = { path = "../../crates/lerux-logging", features = ["serial"] }
sel4-microkit = { workspace = true, features = ["alloc"] }
sel4-microkit-driver-adapters = { workspace = true }
embedded-hal-nb = { workspace = true }
