[package]
name = "display-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Trusted display PD: owns QEMU ramfb; apps present via a shared bitmap MR"

[lints]
workspace = true

[features]
board-qemu_virt_aarch64_display = []

[dependencies]
lerux-driver-protocols = { path = "../../crates/lerux-driver-protocols" }
lerux-interface-types = { path = "../../crates/lerux-interface-types" }
lerux-ipc = { path = "../../crates/lerux-ipc" }
lerux-logging = { path = "../../crates/lerux-logging", features = ["serial"] }
sel4-microkit = { workspace = true }
