[package]
name = "paint-demo"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Untrusted HTML+CSS painter for the Phase 75 paint smoke"

[lints]
workspace = true

[features]
board-qemu_virt_aarch64_paint = []

[dependencies]
lerux-interface-types = { path = "../../crates/lerux-interface-types" }
lerux-ipc = { path = "../../crates/lerux-ipc" }
lerux-logging = { path = "../../crates/lerux-logging", features = ["serial"] }
lerux-web = { path = "../../crates/lerux-web" }
sel4-microkit = { workspace = true, features = ["alloc"] }
