[package]
name = "sddf-shell"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lints]
workspace = true

[features]
net-client = ["dep:smoltcp"]
board-qemu_virt_aarch64_fetch_sddf = ["net-client", "dep:lerux-tls"]
board-qemu_virt_riscv64_fetch_sddf = ["net-client", "dep:lerux-tls"]
board-x86_64_generic_fetch_sddf = ["net-client", "dep:lerux-tls"]
board-x86_64_generic_web_sddf = ["net-client"]
board-qemu_virt_aarch64_web_sddf = ["net-client"]
board-qemu_virt_riscv64_web_sddf = ["net-client"]
board-qemu_virt_aarch64_browser_sddf = ["net-client", "dep:lerux-tls", "dep:lerux-web"]
board-qemu_virt_riscv64_browser_sddf = ["net-client", "dep:lerux-tls", "dep:lerux-web"]
board-qemu_virt_aarch64_fs_sddf = []
board-qemu_virt_riscv64_fs_sddf = []
board-x86_64_generic_fs_sddf = []
board-x86_64_generic_fs_ahci = ["board-x86_64_generic_fs_sddf"]

[dependencies]
lerux-cothread = { path = "../../crates/lerux-cothread" }
lerux-posix = { path = "../../crates/lerux-posix" }
lerux-sddf = { path = "../../crates/lerux-sddf" }
lerux-tls = { path = "../../crates/lerux-tls", optional = true }
lerux-web = { path = "../../crates/lerux-web", optional = true }
sel4-microkit = { workspace = true }
smoltcp = { workspace = true, optional = true, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-dhcpv4",
    "socket-tcp",
] }

[build-dependencies]
lerux-image = { path = "../../../tools/lerux-image" }
