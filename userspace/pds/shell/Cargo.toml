[package]
name = "shell"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lints]
workspace = true

[features]
workstation = []
# On-screen PC console: prompt without fs/net/supervisor callees.
pc-console = []
board-qemu_virt_aarch64_workstation = ["workstation"]
board-qemu_virt_aarch64_interactive = ["workstation"]
board-qemu_virt_riscv64_workstation = ["workstation"]
board-x86_64_generic_workstation = ["workstation"]
board-rpi4b_4gb_workstation = ["workstation"]
board-pc_z97_d3h = ["pc-console"]
board-x86_64_generic_console = ["pc-console"]

[dependencies]
heapless = { workspace = true }
lerux-interface-types = { path = "../../crates/lerux-interface-types" }
lerux-ipc = { path = "../../crates/lerux-ipc" }
lerux-logging = { path = "../../crates/lerux-logging", features = ["server"] }
sel4-microkit = { workspace = true }
sel4-microkit-driver-adapters = { workspace = true }
embedded-hal-nb = { workspace = true }
